<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Slide Snippet</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body className="bg-slate-950 text-slate-100 min-h-screen p-8 flex flex-col items-center justify-center font-sans">

  <!-- ========================================== -->
  <!-- SINGLE MOVIE SLIDE / CARD ITEM (HTML + TAILWIND) -->
  <!-- ========================================== -->
  <div
    classNameName="max-w-xs w-full bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl hover:shadow-indigo-500/10 hover:border-slate-700 transition-all duration-300 group">

    <!-- 1. IMAGE CONTAINER WITH BADGES -->
    <div className="relative aspect-[2/3] w-full overflow-hidden bg-slate-800">
      <img src="" alt=""
        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
      <!-- Gradient Overlay -->
      <div
        className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent opacity-80 group-hover:opacity-60 transition-opacity">
      </div>

      <!-- MOVIE ID BADGE -->
      <span
        className="absolute top-3 left-3 px-2.5 py-1 text-xs font-mono font-bold tracking-wider text-indigo-300 bg-slate-950/80 backdrop-blur-md border border-indigo-500/30 rounded-lg shadow-lg">
        ID: sci-01
      </span>

      <!-- GENRE BADGE -->
      <span
        className="absolute top-3 right-3 px-2.5 py-1 text-xs font-semibold text-emerald-300 bg-emerald-950/80 backdrop-blur-md border border-emerald-500/30 rounded-full shadow-lg">
        Sci-Fi
      </span>

      <!-- RATING FLOATING BADGE -->
      <div
        className="absolute bottom-3 left-3 flex items-center gap-1.5 px-3 py-1.2 bg-amber-950/80 backdrop-blur-md border border-amber-500/30 rounded-xl text-amber-400 text-xs font-bold shadow-lg">
        <svg className="w-4 h-4 fill-amber-400" viewBox="0 0 20 20">
          <path
            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
        </svg>
        <span>4.8 / 5.0</span>
      </div>
    </div>

    <!-- 2. DETAILS SECTION -->
    <div className="p-5 space-y-3">
      <!-- TITLE -->
      <h3 className="text-xl font-bold text-slate-100 group-hover:text-indigo-400 transition-colors truncate"
        title="Atlas">
        {}
      </h3>

      <!-- METADATA GRID (Movie ID, Genre, Rating, Release Date) -->
      <div className="space-y-2 text-xs text-slate-400 pt-2 border-t border-slate-800/80">
        <!-- Movie ID Row -->
        <div className="flex items-center justify-between">
          <span className="text-slate-500">Movie ID:</span>
          <span className="font-mono text-slate-300 font-semibold">{}</span>
        </div>

        <!-- Genre Row -->
        <div className="flex items-center justify-between">
          <span className="text-slate-500">Genre:</span>
          <span className="text-slate-300 font-medium">{}</span>
        </div>

        <!-- Rating Row -->
        <div className="flex items-center justify-between">
          <span className="text-slate-500">Rating:</span>
          <span className="text-amber-400 font-bold flex items-center gap-1">
            <svg className="w-3.5 h-3.5 fill-amber-400 inline" viewBox="0 0 20 20">
              <path
                d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
            </svg>
            {}
          </span>
        </div>

        <!-- Release Date Row -->
        <div className="flex items-center justify-between">
          <span className="text-slate-500">Release Date:</span>
          <span className="text-slate-300 font-medium flex items-center gap-1">
            <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            {}
          </span>
        </div>
      </div>
    </div>

  </div>

</body>

</html>
